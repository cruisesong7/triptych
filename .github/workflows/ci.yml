name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Cedar-free core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Regenerate Verus coverage crates
        run: |
          lake env lean verus-experiments/grammar-coverage/Input.lean
          lake env lean verus-experiments/direct-coverage/Input.lean
          lake env lean verus-experiments/search-order/Input.lean
      - name: Check generated files are current
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  other-examples:
    name: Cedar-free examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: other-examples
      - name: Parser benchmark smoke test
        working-directory: other-examples
        run: lake exe parser_benchmark
      - name: Check generated files are current
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  strata-examples:
    name: Strata examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: strata-examples
      - name: Check generated files are current
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  cedar:
    name: Cedar integration and conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out Triptych
        uses: actions/checkout@v4
        with:
          path: triptych
      - name: Check out pinned Cedar parser API
        uses: actions/checkout@v4
        with:
          repository: cruisesong7/cedar-spec
          ref: 241e40b14c25240f5cb28b1fa1f0c5f9fcd85603
          path: cedar-spec
      - name: Prepare Lean and SubVerso
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: triptych/cedar-examples
          build-args: "@subverso"
      - name: Build Cedar integration, conformance, and docs
        working-directory: triptych/cedar-examples
        run: lake build CedarExamples ConformanceTests docs
      - name: Check generated Lean and Verus files are current
        working-directory: triptych
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  verus:
    name: Verus verification of generated Rust
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cache Verus release and Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            .tools/verus
            ~/.cargo/registry
            ~/.cargo/git
          key: verus-${{ runner.os }}-${{ hashFiles('verus-experiments/setup-verus.sh') }}
      - name: Install pinned Verus and Rust toolchain
        run: ./verus-experiments/setup-verus.sh
      - name: Verify generated crates with --no-cheating
        # Cedar conformance tests and benchmarks need a sibling Cedar Rust checkout; verification
        # does not, so CI verifies the crates without their dev-dependencies.
        run: ./verus-experiments/verify.sh --without-dev-deps
