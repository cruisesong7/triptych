name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Cedar-free core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

  other-examples:
    name: Cedar-free examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: other-examples
      - name: Parser benchmark smoke test
        working-directory: other-examples
        run: lake exe parser_benchmark

  strata-examples:
    name: Strata examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: strata-examples

  cedar:
    name: Cedar integration and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lake fetches Cedar at the revision pinned in cedar-examples/lake-manifest.json.
      - name: Prepare Lean and SubVerso
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: cedar-examples
          build-args: "@subverso"
      - name: Build Cedar integration, conformance, and docs
        working-directory: cedar-examples
        run: lake build CedarExamples ConformanceTests docs
