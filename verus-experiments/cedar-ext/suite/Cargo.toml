[package]
name = "cedar-ext-suite"
version = "0.1.0"
edition = "2021"

[dependencies]
decimal = { path = "../decimal" }
vstd = "=0.0.0-2026-08-30-0159"

[dev-dependencies]
cedar-policy-core = { path = "../../../../cedar/cedar-policy-core", default-features = false, features = [
  "benchmark-internals",
  "datetime",
  "decimal",
  "ipaddr",
] }
# Keep the Verus metadata closure on the already-cached version used by the Decimal package.
jiff = "=0.2.35"

[[bench]]
name = "runtime"
harness = false

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }
